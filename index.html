
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CINEMORA | Movie Collection</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #090b16;
      color: #f4f4ff;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }

    nav {
      min-height: 80px;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: rgba(13, 15, 31, 0.96);
      border-bottom: 1px solid rgba(149, 116, 255, 0.2);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.25);
    }

    nav h1 {
      font-size: clamp(23px, 3vw, 32px);
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(100deg, #fff, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    #icon {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      font-size: 24px;
    }

    #icon i {
      color: #c4b5fd;
      cursor: pointer;
      transition: 0.25s;
    }

    #icon i:hover {
      color: #fff;
      transform: scale(1.12);
    }

    #input {
      display: none;
      width: 230px;
      padding: 12px 16px;
      background: #171a30;
      border: 1px solid #51418b;
      border-radius: 12px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    #input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.2);
    }

    #input::placeholder {
      color: #9396b1;
    }

    .input {
      display: block !important;
    }

    .movie-heading {
      padding: 45px 7% 10px;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .movie-heading h2 {
      font-size: clamp(26px, 4vw, 38px);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .movie-heading h2 span {
      color: #a78bfa;
    }

    .movie-heading p {
      color: #9699b5;
      font-size: 15px;
      line-height: 1.7;
    }

    .collection-bar {
      padding: 25px 7% 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .collection-bar h3 {
      font-size: 19px;
    }

    .collection-bar span {
      color: #a78bfa;
      font-size: 13px;
    }

    .movie-container {
      width: 100%;
      padding: 25px 7% 75px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      align-items: stretch;
      gap: 25px;
    }

    .movie-card {
      min-width: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(167, 139, 250, 0.18);
      border-radius: 20px;
      background: linear-gradient(160deg, #1c2038, #101222 75%);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .movie-card:hover {
      transform: translateY(-7px);
      border-color: #a78bfa;
      box-shadow: 0 20px 45px rgba(124, 58, 237, 0.22);
    }

    .poster-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: #22253c;
    }

    .movie-poster {
      width: 100%;
      height: 310px;
      display: block;
      object-fit: cover;
      object-position: center;
      border-radius: 14px;
      transition: transform 0.45s ease;
    }

    .movie-card:hover .movie-poster {
      transform: scale(1.05);
    }

    .poster-top {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .movie-badge {
      max-width: 65%;
      padding: 6px 8px;
      border-radius: 7px;
      background: linear-gradient(110deg, #7c3aed, #a855f7);
      color: white;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .movie-rating {
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(8, 10, 22, 0.9);
      color: #facc15;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }

    .movie-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 3px 4px 4px;
    }

    .movie-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      color: #a5a8c3;
      font-size: 11px;
    }

    .movie-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .movie-meta i {
      color: #a78bfa;
    }

    .movie-id {
      color: #8589a7;
      font-size: 11px;
    }

    .movie-name {
      font-size: 18px;
      line-height: 1.4;
      font-weight: 850;
      letter-spacing: 0.2px;
    }

    .movie-description {
      min-height: 58px;
      color: #a7abc5;
      font-size: 12px;
      line-height: 1.65;
    }

    .movie-category {
      align-self: flex-start;
      padding: 6px 10px;
      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 8px;
      background: rgba(124, 58, 237, 0.1);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 700;
    }

    .add-btn {
      width: 100%;
      min-height: 44px;
      padding: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(110deg, #7c3aed, #a855f7);
      color: white;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s;
    }

    .add-btn:hover {
      background: linear-gradient(110deg, #6d28d9, #c084fc);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
    }

    .add-btn:active {
      transform: scale(0.97);
    }

    .empty-results {
      grid-column: 1 / -1;
      padding: 65px 15px;
      text-align: center;
      color: #a4a7c1;
      font-size: 17px;
      line-height: 2;
    }

    .empty-results i {
      font-size: 40px;
      color: #a78bfa;
    }

    #watch {
      width: 390px;
      max-width: 100%;
      height: 100vh;
      position: fixed;
      right: -420px;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      background: #111326;
      color: white;
      border-left: 1px solid #393154;
      box-shadow: -20px 0 55px rgba(0, 0, 0, 0.45);
      transition: right 0.35s ease;
    }

    .watchshow {
      right: 0 !important;
    }

    #watch > h1 {
      width: 100%;
      padding: 25px 20px;
      background: linear-gradient(120deg, #6d28d9, #a855f7);
      color: white;
      text-align: center;
      font-size: 23px;
      letter-spacing: 1px;
    }

    #items {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 10px 16px;
      overflow-y: auto;
    }

    #items::-webkit-scrollbar {
      width: 5px;
    }

    #items::-webkit-scrollbar-thumb {
      background: #8b5cf6;
      border-radius: 10px;
    }

    .watch-item {
      width: 100%;
      min-height: 85px;
      padding: 12px 5px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #292c48;
    }

    .watch-poster {
      width: 48px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .watch-details {
      flex: 1;
      min-width: 0;
    }

    .watch-name {
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .watch-category {
      margin-top: 5px;
      color: #9b9db8;
      font-size: 11px;
    }

    .quantity-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border: 1px solid #51418b;
      border-radius: 8px;
      background: #24203e;
      color: white;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    .quantity-btn:hover {
      background: #7c3aed;
      border-color: #a78bfa;
    }

    .quantity-number {
      min-width: 18px;
      text-align: center;
      font-size: 14px;
    }

    .btnswatch {
      width: 100%;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0c0e1d;
      border-top: 1px solid #292c48;
    }

    #countlist,
    #close {
      flex: 1;
      min-height: 44px;
      padding: 11px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s;
    }

    #countlist {
      border: none;
      background: linear-gradient(110deg, #7c3aed, #a855f7);
      color: white;
    }

    #close {
      background: #202238;
      color: #d8ccff;
      border: 1px solid #393154;
    }

    #close:hover {
      background: #303251;
    }

    @media (min-width: 1200px) {
      .movie-container {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .movie-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 17px;
        padding-left: 5%;
        padding-right: 5%;
      }

      .movie-poster {
        height: 270px;
      }
    }

    @media (max-width: 650px) {
      nav {
        padding: 16px 5%;
        gap: 10px;
      }

      nav h1 {
        font-size: 22px;
        letter-spacing: 0;
      }

      #icon {
        gap: 14px;
        font-size: 21px;
      }

      #input {
        position: absolute;
        top: 75px;
        right: 15px;
        width: min(260px, calc(100vw - 30px));
        z-index: 30;
      }

      .movie-heading {
        padding: 35px 5% 10px;
      }

      .movie-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        padding: 20px 4% 45px;
      }

      .movie-card {
        padding: 9px;
        border-radius: 15px;
      }

      .movie-poster {
        height: 235px;
      }

      .movie-name {
        font-size: 15px;
      }

      .movie-description {
        font-size: 11px;
      }

      .movie-badge {
        font-size: 8px;
        padding: 5px 6px;
      }

      .movie-rating {
        font-size: 10px;
        padding: 5px 6px;
      }

      .movie-category {
        font-size: 10px;
      }

      #watch {
        width: 100%;
        right: -105%;
      }

      .watchshow {
        right: 0 !important;
      }
    }

    @media (max-width: 360px) {
      nav h1 {
        font-size: 18px;
      }

      #icon {
        gap: 10px;
        font-size: 19px;
      }

      .movie-container {
        grid-template-columns: minmax(0, 1fr);
      }

      .movie-card {
        width: 100%;
        max-width: 300px;
        justify-self: center;
      }

      .movie-poster {
        height: 320px;
      }
    }
  </style>
</head>

        year: "2023",
        duration: "1h 45m",
        description: "Three heroes discover their powers are mysteriously connected.",
        badge: "MARVEL"
      }
    ];

    let watcharr = [];

    document.getElementById("close").addEventListener("click", () => {
      watch.classList.remove("watchshow");
    });

    document.getElementById("watchmenu").addEventListener("click", () => {
      watch.classList.toggle("watchshow");
    });

    document.getElementById("search").addEventListener("click", () => {
      input.classList.toggle("input");

      if (input.classList.contains("input")) {
        input.focus();
      } else {
        input.value = "";
        main(movies);
      }
    });

    function main(movieList) {
      const par = document.getElementById("movie-list");

      par.innerHTML = "";
      movieCount.textContent = movieList.length + (movieList.length === 1 ? " movie found" : " movies found");

      if (movieList.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-results";
        empty.innerHTML = '<i class="ri-search-eye-line"></i><br>No movies found. Try another search.';
        par.append(empty);
        return;
      }

      movieList.forEach((k) => {
        const div = document.createElement("div");
        div.className = "movie-card";

        const posterWrapper = document.createElement("div");
        posterWrapper.className = "poster-wrapper";

        const img1 = document.createElement("img");
        img1.src = k.image;
        img1.alt = k.name + " movie poster";
        img1.className = "movie-poster";
        img1.loading = "lazy";

        img1.onerror = () => {
          img1.onerror = null;
          img1.src = "https://placehold.co/500x750/171a30/a78bfa?text=" + encodeURIComponent(k.name);
        };

        const posterTop = document.createElement("div");
        posterTop.className = "poster-top";

        const badge = document.createElement("span");
        badge.className = "movie-badge";
        badge.textContent = k.badge;

        const rating = document.createElement("span");
        rating.className = "movie-rating";
        rating.innerHTML = '<i class="ri-star-fill"></i> ' + k.rating;

        posterTop.append(badge, rating);
        posterWrapper.append(img1, posterTop);

        const info = document.createElement("div");
        info.className = "movie-info";

        const meta = document.createElement("div");
        meta.className = "movie-meta";

        const year = document.createElement("span");
        year.innerHTML = '<i class="ri-calendar-line"></i> ' + k.year;

        const duration = document.createElement("span");
        duration.innerHTML = '<i class="ri-time-line"></i> ' + k.duration;

        meta.append(year, duration);

        const id = document.createElement("p");
        id.className = "movie-id";
        id.textContent = "MOVIE ID · " + k.id;

        const h1 = document.createElement("h2");
        h1.className = "movie-name";
        h1.textContent = k.name;

        const description = document.createElement("p");
        description.className = "movie-description";
        description.textContent = k.description;

        const category = document.createElement("span");
        category.className = "movie-category";
        category.innerHTML = '<i class="ri-film-line"></i> ' + k.category;

        const btn = document.createElement("button");
        btn.className = "add-btn";
        btn.innerHTML = '<i class="ri-bookmark-line"></i> Add to Watchlist';

        btn.addEventListener("click", () => {
          const exist = watcharr.find((i) => i.id === k.id);

          if (exist) {
            alert("This movie is already in your watchlist.");
          } else {
            watcharr.push({
              id: k.id,
              name: k.name,
              image: k.image,
              category: k.category,
              watch: 1
            });
          }

          watchfunc();
        });

        info.append(meta, id, h1, description, category, btn);
        div.append(posterWrapper, info);
        par.append(div);
      });
    }

    input.addEventListener("input", () => {
      const check = input.value.toLowerCase().trim();

      const filteredMovies = movies.filter((movie) =>
        movie.name.toLowerCase().includes(check) ||
        movie.category.toLowerCase().includes(check) ||
        movie.description.toLowerCase().includes(check)
      );

      main(filteredMovies);
    });

    function watchfunc() {
      items.innerHTML = "";

      watcharr.forEach((o) => {
        const div2 = document.createElement("div");
        div2.className = "watch-item";

        const img11 = document.createElement("img");
        img11.src = o.image;
        img11.alt = o.name;
        img11.className = "watch-poster";
        img11.onerror = () => {
          img11.onerror = null;
          img11.src = "https://placehold.co/100x150/171a30/a78bfa?text=Movie";
        };

        const details = document.createElement("div");
        details.className = "watch-details";

        const h11 = document.createElement("h6");
        h11.className = "watch-name";
        h11.textContent = o.name;

        const h61 = document.createElement("p");
        h61.className = "watch-category";
        h61.textContent = o.category;

        details.append(h11, h61);


        div2.append(img11, details);
        items.append(div2);
      });

      const total = watcharr.reduce((sum, movie) => sum + movie.watch, 0);
      countlist.textContent = "Total: " + total;
    }

    const movieList = document.createElement("div");
    movieList.id = "movie-list";
    movieList.className = "movie-container";
    document.body.insertBefore(movieList, document.getElementById("watch"));

    main(movies);
    watchfunc();
  </script>
</body>
</html>
