<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CINEMORA | Movie Collection</title>

  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #090b16;
      color: #f4f4ff;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }

    /* NAVBAR */

    nav {
      min-height: 82px;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: rgba(13, 15, 31, 0.94);
      border-bottom: 1px solid rgba(149, 116, 255, 0.18);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.25);
    }

    nav h1 {
      font-size: clamp(22px, 3vw, 31px);
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(100deg, #fff, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    #icon {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      font-size: 24px;
    }

    #icon i {
      color: #c4b5fd;
      cursor: pointer;
      transition: 0.25s;
    }

    #icon i:hover {
      color: #fff;
      transform: scale(1.12);
    }

    /* SEARCH */

    input {
      display: none;
      width: 230px;
      padding: 12px 17px;
      background: #171a30;
      border: 1px solid #51418b;
      border-radius: 12px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.2);
    }

    input::placeholder {
      color: #9396b1;
    }

    .input {
      display: block !important;
    }

    /* MOVIE COLLECTION */

    .movie-heading {
      padding: 45px 7% 10px;
    }

    .movie-heading h2 {
      font-size: clamp(25px, 4vw, 36px);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .movie-heading h2 span {
      color: #a78bfa;
    }

    .movie-heading p {
      color: #9699b5;
      font-size: 15px;
      line-height: 1.7;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    /* MOVIE CARDS CONTAINER */

    .movie-container {
      width: 100%;
      min-height: 50vh;
      padding: 25px 10% 70px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 25px;
    }

    .movie-card {
      width: 270px;
      max-width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 13px;
      border: 1px solid #292c48;
      border-radius: 18px;
      background: linear-gradient(150deg, #191c33, #101222 75%);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s,
        box-shadow 0.3s;
    }

    .movie-card:hover {
      transform: translateY(-7px);
      border-color: #8b5cf6;
      box-shadow: 0 18px 40px rgba(124, 58, 237, 0.18);
    }

    .movie-poster {
      width: 100%;
      height: 300px;
      display: block;
      object-fit: cover;
      object-position: center;
      border-radius: 12px;
      background: #22253c;
    }

    .movie-id {
      color: #8589a7;
      font-size: 12px;
    }

    .movie-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .movie-category {
      align-self: flex-start;
      padding: 6px 10px;
      border: 1px solid #393154;
      border-radius: 20px;
      background: #211d39;
      color: #c4b5fd;
      font-size: 12px;
    }

    .add-btn {
      width: 100%;
      min-height: 43px;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(110deg, #7c3aed, #a855f7);
      color: white;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s;
    }

    .add-btn:hover {
      background: linear-gradient(110deg, #6d28d9, #c084fc);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
    }

    .empty-results {
      width: 100%;
      padding: 60px 15px;
      text-align: center;
      color: #a4a7c1;
      font-size: 17px;
    }

    /* WATCHLIST SIDEBAR */

    #watch {
      width: 390px;
      max-width: 100%;
      height: 100vh;
      position: fixed;
      right: -420px;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      gap: 0;
      background: #111326;
      color: white;
      border-left: 1px solid #393154;
      box-shadow: -20px 0 55px rgba(0, 0, 0, 0.45);
      transition: right 0.35s ease;
    }

    .watchshow {
      right: 0 !important;
    }

    #watch > h1 {
      width: 100%;
      padding: 25px 20px !important;
      background: linear-gradient(120deg, #6d28d9, #a855f7) !important;
      color: white !important;
      text-align: center;
      font-size: 24px;
      letter-spacing: 1px;
    }

    #items {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 10px 16px;
      overflow-y: auto;
    }

    #items::-webkit-scrollbar {
      width: 5px;
    }

    #items::-webkit-scrollbar-thumb {
      background: #8b5cf6;
      border-radius: 10px;
    }

    .watch-item {
      width: 100%;
      min-height: 85px;
      padding: 12px 5px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #292c48;
    }

    .watch-poster {
      width: 48px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .watch-details {
      flex: 1;
      min-width: 0;
    }

    .watch-name {
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .watch-category {
      margin-top: 5px;
      color: #9b9db8;
      font-size: 11px;
    }

    .quantity-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border: 1px solid #51418b;
      border-radius: 8px;
      background: #24203e;
      color: white;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    .quantity-btn:hover {
      background: #7c3aed;
      border-color: #a78bfa;
    }

    .quantity-number {
      min-width: 18px;
      text-align: center;
      font-size: 14px;
    }

    .btnswatch {
      width: 100%;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0c0e1d;
      border-top: 1px solid #292c48;
    }

    #countlist,
    #close {
      flex: 1;
      min-height: 44px;
      padding: 11px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s;
    }

    #countlist {
      border: none;
      background: linear-gradient(110deg, #7c3aed, #a855f7);
      color: white;
    }

    #countlist:hover {
      filter: brightness(1.15);
    }

    #close {
      background: #202238;
      color: #d8ccff;
      border: 1px solid #393154;
    }

    #close:hover {
      background: #303251;
    }

    /* RESPONSIVE */

    @media (max-width: 700px) {
      nav {
        padding: 16px 5%;
        gap: 10px;
      }

      nav h1 {
        font-size: 21px;
        letter-spacing: 0;
      }

      #icon {
        gap: 14px;
        font-size: 21px;
      }

      input {
        position: absolute;
        top: 75px;
        right: 15px;
        width: min(260px, calc(100vw - 30px));
        z-index: 30;
      }

      .movie-heading {
        padding: 35px 5% 10px;
      }

      .movie-container {
        padding: 20px 5% 45px;
        justify-content: center;
        gap: 18px;
      }

      .movie-card {
        width: min(100%, 320px);
      }

      .movie-poster {
        height: 300px;
      }

      #watch {
        width: 100%;
        right: -105%;
      }

      .watchshow {
        right: 0 !important;
      }
    }

    @media (max-width: 360px) {
      nav h1 {
        font-size: 18px;
      }

      #icon {
        gap: 10px;
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <nav>
    <h1>CINEMORA</h1>

    <div id="icon">
      <i class="ri-search-2-line" id="search"></i>
      <input type="text" placeholder="Search movies..." id="input" />
      <i class="ri-bookmark-line" id="watchmenu"></i>
    </div>
  </nav>

  <section class="movie-heading">
    <div class="section-label">
      <i class="ri-sparkling-2-line"></i>
      YOUR CINEMA COLLECTION
    </div>
    <h2>Discover your next <span>favorite.</span></h2>
    <p>Explore movies and build your personal watchlist.</p>
  </section>

  <div id="watch">
    <h1>
      <i class="ri-bookmark-3-line"></i>
      My Watchlist
    </h1>

    <div id="items"></div>

    <div class="btnswatch">
      <button id="countlist">Total: 0</button>
      <button id="close">Close</button>
    </div>
  </div>

  <script>
    let icon = document.getElementById("icon");
    let items = document.getElementById("items");
    let countlist = document.getElementById("countlist");

    let close = document
      .getElementById("close")
      .addEventListener("click", () => {
        watch.classList.remove("watchshow");
      });

    let watch = document.getElementById("watch");
    let input = document.getElementById("input");
    let watchmenu = document.getElementById("watchmenu");

    watchmenu.addEventListener("click", () => {
      watch.classList.toggle("watchshow");
    });

    let search = document
      .getElementById("search")
      .addEventListener("click", () => {
        input.classList.toggle("input");
      });

      
let movies = [
  {
    id: 1,
    name: "LEO",
    category: "Action",
    image:
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyoEonIMX8lz5RbH67T89Dyz8qnB3k-GCgqD8ay0i0Xg&s=10",
  },
  {
    id: 2,
    name: "GOAT",
    category: "Action",
    image:
      "https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcTaEKaHp3bBNYG1kdLNH4KTAOvprUuxUvvLdxy5bhAlN9wWEpZg",
  },
  {
    id: 3,
    name: "LOVE TODAY",
    category: "Comedy",
    image:
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQ_1v0b4a4H3BTpcxVO_4Eb2jwyHA07O7uiD14y70h1A&s",
  },
  {
    id: 4,
    name: "INTERSTELLAR",
    category: "Sci-Fi",
    image:
      "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
  },
  {
    id: 5,
    name: "AVENGERS: ENDGAME",
    category: "Superhero",
    image:
      "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",
  },
  {
    id: 6,
    name: "SPIDER-MAN: NO WAY HOME",
    category: "Superhero",
    image:
      "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",
  },
  {
    id: 7,
    name: "THE BATMAN",
    category: "Action",
    image:
      "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg",
  },
  {
    id: 8,
    name: "INCEPTION",
    category: "Thriller",
    image:
      "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",
  },
];


      let par = document.createElement("div");
    par.className = "movie-container";

    document.body.append(par);

    let watcharr = [];

    function main(item) {
      par.innerHTML = "";

      if (item.length === 0) {
        let empty = document.createElement("div");
        empty.className = "empty-results";
        empty.innerHTML =
          '<i class="ri-search-eye-line"></i><br>No movies found. Try another search.';
        par.append(empty);
        return;
      }

      item.forEach((k) => {
        let div = document.createElement("div");
        div.className = "movie-card";

        let h1 = document.createElement("h2");
        h1.className = "movie-name";
        h1.innerHTML = k.name;

        let img1 = document.createElement("img");
        img1.src = k.image;
        img1.alt = k.name + " movie poster";
        img1.className = "movie-poster";

        let p1 = document.createElement("p");
        p1.className = "movie-id";
        p1.innerHTML = "MOVIE ID · " + k.id;

        let h6 = document.createElement("h4");
        h6.className = "movie-category";
        h6.innerHTML = '<i class="ri-film-line"></i> ' + k.category;

        let btn = document.createElement("button");
        btn.className = "add-btn";
        btn.innerHTML =
          '<i class="ri-bookmark-line"></i> Add to Watchlist';

        btn.addEventListener("click", () => {
          let exist = watcharr.find((i) => i.id === k.id);

          if (exist) {
            alert("The movie is Already in watchlist");
          } else {
            watcharr.push({
              id: k.id,
              name: k.name,
              image: k.image,
              category: k.category,
              watch: 1,
            });
          }

          watchfunc();
        });

        div.append(img1, p1, h1, h6, btn);
        par.append(div);
      });
    }

    main(movies);

    input.addEventListener("input", () => {
      let check = input.value.toLowerCase();
      let filter = movies.filter((g) =>
        g.name.toLowerCase().includes(check)
      );

      main(filter);
    });

    function watchfunc() {
      items.innerHTML = "";

      watcharr.forEach((o) => {
        let div2 = document.createElement("div");
        div2.className = "watch-item";

        let img11 = document.createElement("img");
        img11.src = o.image;
        img11.alt = o.name;
        img11.className = "watch-poster";

        let details = document.createElement("div");
        details.className = "watch-details";

        let h11 = document.createElement("h6");
        h11.className = "watch-name";
        h11.innerHTML = o.name;

        let h61 = document.createElement("p");
        h61.className = "watch-category";
        h61.innerHTML = o.category;

        details.append(h11, h61);

        let btn1 = document.createElement("button");
        btn1.className = "quantity-btn";
        btn1.innerHTML = "-";

        btn1.addEventListener("click", () => {
          o.watch--;

          if (o.watch <= 0) {
            watcharr = watcharr.filter((u) => u.id !== o.id);
          }

          watchfunc();
        });

        let watchtimes = document.createElement("p");
        watchtimes.className = "quantity-number";
        watchtimes.innerHTML = o.watch;

        let btn2 = document.createElement("button");
        btn2.className = "quantity-btn";
        btn2.innerHTML = "+";

        btn2.addEventListener("click", () => {
          o.watch++;
          watchfunc();
        });

        div2.append(
          img11,
          details,
          btn1,
          watchtimes,
          btn2
        );

        items.append(div2);
      });

      countlist.innerHTML = "Total: " + watcharr.length;
    }
  </script>
</body>
</html>
